services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: textile_waste
      POSTGRES_USER: textile_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U textile_user -d textile_waste"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://textile_user:${POSTGRES_PASSWORD}@database:5432/textile_waste
      MONGODB_URL: mongodb://mongo:27017/textile_intelligence
      FABRIC_MODEL_PATH: /models/best_efficientnet_b0_no_weights.pth
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - ./models:/models:ro
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data: